name: Publish to PyPI

# Runs when a GitHub Release is published (e.g. tag v2.0.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          PKG=$(python -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("src/jenga_nlp/__version__.py").read()).group(1))')
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "Tag $TAG != package version $PKG"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jenga-nlp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
