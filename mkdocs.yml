site_name: JengaNLP
site_description: Config-driven multi-task NLP for Python - one shared transformer encoder, many task heads, load-once production inference.
site_url: https://rogendo.github.io/JengaNLP/
repo_url: https://github.com/Rogendo/JengaNLP
repo_name: Rogendo/JengaNLP
edit_uri: edit/main/docs/
site_author: Peter (Rogendo), Fredrick Kioko
copyright: 'Copyright &copy; 2026 <a href="https://github.com/Rogendo">Peter (Rogendo)</a> and <a href="https://github.com/its-kios09">Fredrick Kioko</a> · MIT licensed'

docs_dir: docs

theme:
  name: material
  # overrides/main.html makes the browser/search-engine <title> use each page's
  # front-matter `title` (keyword-focused) while the nav keeps short labels.
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Task types:
      - Overview: tasks/index.md
      - Text classification: tasks/classification.md
      - Sentiment analysis: tasks/sentiment.md
      - Multi-label classification: tasks/multi-label.md
      - Named entity recognition: tasks/ner.md
      - Text regression: tasks/regression.md
      - Call centre QA scoring: tasks/qa-scoring.md
      - Multi-task learning: tasks/multi-task.md
  - Configuration: configuration.md
  - Production inference: inference.md
  - Domain-adaptive pretraining: domain-adaptation.md
  - User guide: usage-guide.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rogendo/JengaNLP
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jenga-nlp/
