[build-system]
requires = ["setuptools>=68.0,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenga-nlp"
dynamic = ["version"]
description = "Config-driven multi-task NLP: one shared transformer encoder, many task heads, load-once production inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Peter (Rogendo)"},
    {name = "Fredrick Kioko (its-kios09)"},
]
keywords = ["nlp", "multi-task-learning", "african-languages", "transformers", "jenga-nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "setuptools>=68.0,<81",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.1.99",  # AfriBERTa ships only a SentencePiece tokenizer model
    "datasets>=2.18.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "mlflow>=2.10.0",
    "tensorboard>=2.15.0",
]

[project.optional-dependencies]
asr = [
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
wandb = [
    "wandb>=0.16.0",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
jenga-nlp = "jenga_nlp.cli:main"

[project.urls]
Homepage = "https://rogendo.github.io/JengaNLP/"
Documentation = "https://rogendo.github.io/JengaNLP/"
Repository = "https://github.com/Rogendo/JengaNLP"
"Bug Tracker" = "https://github.com/Rogendo/JengaNLP/issues"
Changelog = "https://github.com/Rogendo/JengaNLP/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "jenga_nlp.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["docs*", "examples*", "__pycache__*", "*.egg-info*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
