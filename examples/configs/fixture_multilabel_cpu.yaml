project_name: fixture_multilabel_cpu

model:
  base_model: distilbert-base-uncased
  dropout: 0.1

tokenizer:
  max_length: 64
  padding: max_length
  truncation: true

tasks:
  - name: mpesa_risk_tags
    type: multi_label_classification
    data_path: /home/naynek/jenga_nlp/examples/fixtures/sample_multilabel.jsonl
    text_column: text
    label_column: labels
    heads:
      - name: risk_tags
        num_labels: 4
    label_maps:
      risk_tags:
        0: fraud
        1: phishing
        2: account_takeover
        3: social_engineering

training:
  output_dir: /tmp/jenganlp_fixture_multilabel_cpu
  learning_rate: 0.00005
  batch_size: 2
  eval_batch_size: 2
  num_epochs: 3
  weight_decay: 0.0
  warmup_steps: 0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  use_amp: false
  device: cpu
  metric_for_best_model: eval_loss
  greater_is_better: false
  logging:
    service: none
    experiment_name: fixture_multilabel_cpu
    log_every_n_steps: 1
  checkpoint:
    save_every_n_epochs: 1
    save_best: true
    max_checkpoints: 1
  data:
    test_size: 0.25
    seed: 42
    num_workers: 0
    pin_memory: false
