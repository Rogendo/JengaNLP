# JengaNLP Hugging Face demo
#
# Workflow:
#   1. Train locally on a small binary classification fixture
#   2. Save the model artifact under ./results/jenganlp_hf_demo
#   3. Push the artifact folder to Hugging Face Hub
#   4. Reuse the saved checkpoint for local inference
#
# Usage:
#   python examples/run_jenganlp_hf_demo.py \
#     --config configs/jenganlp_hf_demo.yaml \
#     --repo-id your-username/jenganlp-demo \
#     --token $HF_TOKEN

project_name: jenganlp_hf_demo

model:
  base_model: distilbert-base-uncased
  dropout: 0.1
  freeze_encoder_layers: 0
  gradient_checkpointing: false

tokenizer:
  max_length: 128
  padding: max_length
  truncation: true

training:
  output_dir: ./results/jenganlp_hf_demo
  learning_rate: 2.0e-5
  batch_size: 8
  num_epochs: 2
  weight_decay: 0.01
  warmup_steps: 10
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  use_amp: false
  device: auto
  task_sampling: round_robin
  temperature: 2.0
  metric_for_best_model: eval_loss
  greater_is_better: false
  logging:
    service: tensorboard
    experiment_name: jenganlp_hf_demo
    log_every_n_steps: 1
  checkpoint:
    save_every_n_epochs: 1
    save_best: true
    max_checkpoints: 1
  data:
    test_size: 0.2
    seed: 42
    num_workers: 0
    pin_memory: false

tasks:
  - name: fraud_detection
    type: single_label_classification
    data_path: fixtures/sample_classification.jsonl
    text_column: text
    label_column: label
    heads:
      - name: fraud
        num_labels: 2
        weight: 1.0
        dropout: 0.1
