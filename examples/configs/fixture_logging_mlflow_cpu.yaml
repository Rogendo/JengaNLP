project_name: fixture_logging_mlflow_cpu

model:
  base_model: hf-internal-testing/tiny-random-bert
  dropout: 0.1

tokenizer:
  max_length: 64
  padding: max_length
  truncation: true

tasks:
  - name: mpesa_sentiment
    type: sentiment
    data_path: fixtures/sample_sentiment.jsonl
    text_column: text
    label_column: label
    heads:
      - name: sentiment_head
        num_labels: 3

training:
  output_dir: /tmp/jenganlp_fixture_logging_mlflow_cpu
  learning_rate: 0.00005
  batch_size: 2
  eval_batch_size: 2
  num_epochs: 1
  weight_decay: 0.0
  warmup_steps: 0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  use_amp: false
  device: cpu
  metric_for_best_model: eval_loss
  greater_is_better: false
  logging:
    service: mlflow
    experiment_name: fixture_logging_mlflow_cpu
    tracking_uri: file:///tmp/jenganlp_mlruns
    log_every_n_steps: 1
  checkpoint:
    save_every_n_epochs: 1
    save_best: true
    max_checkpoints: 1
  data:
    test_size: 0.2
    seed: 42
    num_workers: 0
    pin_memory: false
